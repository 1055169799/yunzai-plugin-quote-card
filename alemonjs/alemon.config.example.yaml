# https://alemonjs.com/docs/alemonjsDocs/getting-started/config
# 复制为 alemon.config.yaml 后填写

# 框架提示语言：zh-CN / en-US
language: zh-CN

# 全局主人（UserKey：<平台>:<账号>；master_id 直接填账号）
master_id:
  - '你的QQ号'

# ===== OneBot（QQ 协议端，如 NapCat / Lagrange）=====
onebot:
  # 正向连接：协议端的 ws 地址（reverse_enable 为 false 时使用）
  url: ws://127.0.0.1:3001
  # 协议端 access token（未设置可留空）
  token: ''
  # 反向 WS：由协议端主动连到本服务 17158 端口
  reverse_enable: true
  reverse_port: 17158
  version: 11
  master_id:
    - '你的QQ号'

# ===== QQ 官方机器人（https://q.qq.com）=====
# 凭据格式：机器人QQ号 : AppID : Token : AppSecret
# Token 仅 Webhook 回调校验用，走 WebSocket 模式无需填写
qq-bot:
  app_id: '你的AppID'
  secret: '你的AppSecret'
  master_id:
    # QQ 号在官方机器人平台不生效，主人需填平台下发的 openid
    - '官方机器人下发的 openid'
  sandbox: false
  is_private: false
