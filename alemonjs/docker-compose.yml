services:
  # OneBot 平台（对接 NapCat / Lagrange 等 QQ 协议端）
  onebot:
    build: .
    image: alemonjs-app:latest
    container_name: alemonjs-onebot
    restart: unless-stopped
    command: ["node", "index.js", "--platform", "@alemonjs/onebot", "--serverPort", "17117"]
    ports:
      - "17158:17158" # OneBot 反向 WS 监听端口（reverse_enable: true 时协议端连这里）
      - "17117:17117" # Web 控制台 http://localhost:17117
    volumes:
      - ./alemon.config.yaml:/app/alemon.config.yaml:ro
      - alemon-data:/app/.alemon
      - ./data:/app/data # 名言卡片背景等业务数据（node 用户可写）

  # QQ 官方机器人（需在 alemon.config.yaml 填 app_id / secret）
  qqbot:
    image: alemonjs-app:latest
    build: .
    container_name: alemonjs-qqbot
    restart: unless-stopped
    command: ["node", "index.js", "--platform", "@alemonjs/qq-bot", "--serverPort", "17118"]
    environment:
      - NTQQ_WS=dev # 临时：打印网关原始报文，排查完删除
    ports:
      - "17118:17118" # Web 控制台 http://localhost:17118
    volumes:
      - ./alemon.config.yaml:/app/alemon.config.yaml:ro
      - alemon-data:/app/.alemon
      - ./data:/app/data

  # NapCat QQ 协议端（登录 QQ 后通过反向 WS 连接 onebot 服务）
  napcat:
    image: mlikiowa/napcat-docker:latest
    container_name: napcat
    restart: unless-stopped
    environment:
      - ACCOUNT=1941248284 # 已登录账号，容器重启后自动快速登录
      - WEBUI_PORT=6099
    ports:
      - "6099:6099" # NapCat WebUI http://localhost:6099
    volumes:
      - ./napcat/config:/app/napcat/config
      - ./napcat/data:/app/napcat/data

volumes:
  alemon-data:
