<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>

*{margin:0;padding:0;box-sizing:border-box}

@font-face{
font-family:SoftFont;
src:local("ZCOOL KuaiLe"),local("YouYuan"),local("PingFang SC"),local("Microsoft YaHei");
}

body{
width:1280px;
height:640px;
display:flex;
align-items:center;
justify-content:center;
overflow:hidden;
background:transparent;
font-family:SoftFont,sans-serif;
}

.glass-shell{
width:1280px;
height:640px;
position:relative;
overflow:hidden;
border-radius:64px;
background:{{bgColor}};
border:1px solid rgba(255,255,255,.45);
box-shadow:
inset 0 0 80px rgba(255,255,255,.18),
0 30px 80px rgba(0,0,0,.18);
}

.bg-image{
position:absolute;
inset:0;
width:100%;
height:100%;
object-fit:cover;
z-index:0;
}

.bg-mask{
position:absolute;
inset:0;
z-index:1;
background:linear-gradient(135deg,rgba(255,255,255,.22),rgba(0,0,0,.18));
}

.glass-shell:before{
content:"";
position:absolute;
inset:-40%;
z-index:1;
background:
radial-gradient(circle at 15% 20%,rgba(255,255,255,.28),transparent 28%),
radial-gradient(circle at 85% 80%,rgba(255,255,255,.18),transparent 25%);
filter:blur(30px);
pointer-events:none;
}

.glass-shell:after{
content:"";
position:absolute;
left:0;right:0;bottom:0;
height:120px;
z-index:1;
background:linear-gradient(180deg,transparent,rgba(255,255,255,.12));
pointer-events:none;
}

.edge-left,.edge-right{
position:absolute;
top:0;
width:10px;
height:100%;
background:linear-gradient(180deg,transparent,rgba(255,255,255,.6),transparent);
filter:blur(8px);
z-index:3;
}

.edge-left{left:8px}
.edge-right{right:8px}

.main-box{
width:100%;
height:100%;
display:flex;
position:relative;
z-index:2;
}

.left-avatar{
width:50%;
height:100%;
display:flex;
align-items:center;
justify-content:center;
position:relative;
}

.left-avatar:before{
content:"";
position:absolute;
width:500px;
height:500px;
border-radius:50%;
background:radial-gradient(circle,rgba(255,255,255,.3),transparent 65%);
filter:blur(25px);
}

.avatar-img{
width:430px;
height:430px;
border-radius:50%;
object-fit:cover;
position:relative;
border:6px solid rgba(255,255,255,.42);
box-shadow:
0 0 0 18px rgba(255,255,255,.08),
0 30px 70px rgba(0,0,0,.22);
}

.right-text{
width:50%;
height:100%;
display:flex;
align-items:center;
justify-content:center;
padding:0 55px;
}

.text-card{
width:100%;
padding:48px 42px;
border-radius:42px;
position:relative;
overflow:hidden;
background:rgba(255,255,255,.18);
backdrop-filter:blur(30px) saturate(160%);
-webkit-backdrop-filter:blur(30px) saturate(160%);
border:1px solid rgba(255,255,255,.45);
box-shadow:
inset 0 0 70px rgba(255,255,255,.18),
0 25px 60px rgba(0,0,0,.16);
}

.text-card:before{
content:"";
position:absolute;
inset:0;
background:linear-gradient(135deg,rgba(255,255,255,.3),transparent 45%);
}

.quote-symbol{
position:relative;
font-size:110px;
line-height:.8;
font-family:serif;
color:rgba(0,0,0,.08);
}

.quote-content{
position:relative;
font-size:{{fontSize}}px;
font-weight:800;
color:#111;
line-height:1.9;
letter-spacing:1px;
word-break:break-word;
}

.author-desc{
position:relative;
margin-top:35px;
font-size:27px;
font-weight:700;
color:rgba(0,0,0,.35);
letter-spacing:1px;
}

.spark{
position:absolute;
inset:0;
z-index:4;
pointer-events:none;
}

.spark:before{
content:"";
position:absolute;
width:180px;
height:180px;
left:12%;
top:12%;
background:radial-gradient(circle,rgba(255,255,255,.45),transparent 45%);
filter:blur(25px);
}

.spark:after{
content:"";
position:absolute;
width:150px;
height:150px;
right:12%;
bottom:12%;
background:radial-gradient(circle,rgba(255,255,255,.3),transparent 45%);
filter:blur(25px);
}

.inner-line{
position:absolute;
inset:14px;
border:1.5px solid rgba(255,255,255,.6);
border-radius:50px;
z-index:5;
pointer-events:none;
}

.inner-line-2{
position:absolute;
inset:22px;
border:1px solid rgba(255,255,255,.28);
border-radius:42px;
z-index:5;
pointer-events:none;
}

/* ===== 样式2：深色名言卡片 ===== */
.shell-s2{
width:1680px;height:640px;
position:relative;
overflow:hidden;
background:#1A1A1A;
}
.shell-s2 .left-area{
position:absolute;
left:0;top:0;
width:1040px;height:100%;
overflow:hidden;
z-index:0;
}
.shell-s2 .blur-bg{
position:absolute;
left:0;top:0;
width:100%;height:100%;
object-fit:cover;
filter:blur(28px) brightness(0.42);
transform:scale(1.15);
}
.shell-s2 .main-bg{
position:absolute;
left:0;top:0;
width:100%;height:100%;
object-fit:contain;
opacity:0.2;
}
.shell-s2 .avatar-right{
position:absolute;
right:0;top:0;
width:640px;height:100%;
object-fit:cover;
z-index:1;
-webkit-mask-image:linear-gradient(to right, rgba(0,0,0,0.2), rgba(0,0,0,0.8));
mask-image:linear-gradient(to right, rgba(0,0,0,0.2), rgba(0,0,0,0.8));
}
.shell-s2 .quote-layer{
position:absolute;
left:0;top:0;
width:1040px;height:100%;
z-index:2;
padding:72px 84px 64px 84px;
display:flex;
flex-direction:column;
pointer-events:none;
}
.shell-s2 .quote-left{
font-size:130px;
line-height:.5;
font-family:"Times New Roman",serif;
color:rgba(255,255,255,.95);
text-shadow:0 3px 14px rgba(0,0,0,.6);
}
.shell-s2 .quote-content{
flex:1;
display:flex;
align-items:center;
justify-content:center;
text-align:center;
font-size:{{fontSize}}px;
font-weight:700;
color:#fff;
line-height:1.7;
letter-spacing:1px;
white-space:normal;
word-break:break-word;
word-wrap:break-word;
overflow-wrap:break-word;
text-shadow:0 2px 14px rgba(0,0,0,.7);
}
.shell-s2 .quote-right{
align-self:flex-end;
font-size:130px;
line-height:.5;
font-family:"Times New Roman",serif;
color:rgba(255,255,255,.95);
text-shadow:0 3px 14px rgba(0,0,0,.6);
}
.shell-s2 .author{
align-self:flex-end;
margin-top:20px;
font-size:30px;
font-weight:700;
color:rgba(255,255,255,.75);
letter-spacing:1px;
text-shadow:0 2px 10px rgba(0,0,0,.65);
}

</style>
</head>
<body{{if style2}} style="width:1680px;height:640px;"{{/if}}>

{{if style2}}

<!-- ===== 样式2：深色名言卡片 ===== -->
<div class="shell-s2">
    <div class="left-area">
        {{if bgImage}}
        <img class="blur-bg" src="{{@ bgImage}}">
        <img class="main-bg" src="{{@ bgImage}}">
        {{/if}}
        <div class="quote-layer">
            <div class="quote-left">“</div>
            <div class="quote-content">{{@ text}}</div>
            <div class="quote-right">”</div>
            {{if senderName}}
            <div class="author">— {{senderName}}</div>
            {{/if}}
        </div>
    </div>
    {{if avatar}}
    <img class="avatar-right" src="{{@ avatar}}">
    {{/if}}
</div>

{{else}}

<!-- ===== 样式1：原版玻璃质感 ===== -->
<div class="glass-shell">
    {{if bgImage}}
    <img class="bg-image" src="{{@ bgImage}}">
    <div class="bg-mask"></div>
    {{/if}}
    <div class="edge-left"></div>
    <div class="edge-right"></div>
    <div class="spark"></div>
    <div class="inner-line"></div>
    <div class="inner-line-2"></div>

    <div class="main-box">
        <div class="left-avatar">
            <img class="avatar-img" src="{{@ avatar}}">
        </div>

        <div class="right-text">
            <div class="text-card">
                <div class="quote-symbol">"</div>
                <p class="quote-content">{{@ text}}</p>
                {{if senderName}}
                <p class="author-desc">— {{senderName}}</p>
                {{/if}}
            </div>
        </div>
    </div>
</div>

{{/if}}

</body>
</html>
